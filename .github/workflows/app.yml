name: Build App

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Debug'
        type: boolean
        required: false
        default: false

      prerelease:
        description: 'Prerelease'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      KEYSTORE: ${{ secrets.KEYSTORE }}

    outputs:
      versionName: ${{ steps.buildWithGradle.outputs.versionName }}
      artifactName: ${{ steps.buildWithGradle.outputs.artifactName }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.prerelease && 'beta' || 'master' }}
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Validate Signing Config
        run: |
          if [ "${{ inputs.debug }}" = "false" ] && [ "$KEYSTORE" = "" ]; then
            echo "::error::Signing secrets not configured. Signing secrets are required for release builds."
            exit 1
          fi

      - name: Create signing.properties
        if: ${{ !inputs.debug && env.KEYSTORE != '' }}
        run: |
          echo KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} > signing.properties
          echo KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }} >> signing.properties
          echo KEYSTORE_ALIAS_PASSWORD='${{ secrets.KEYSTORE_ALIAS_PASSWORD }}' >> signing.properties
          echo KEYSTORE_FILE=../key.jks >> signing.properties
          echo ${{ secrets.KEYSTORE }} | base64 --decode > key.jks

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          build-scan-publish: false

      - name: Build with Gradle
        id: buildWithGradle
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties

          if [ "${{ inputs.debug }}" = "true" ]; then
            CMD="./gradlew :manager:assembleDebug"
            APK_DIR="manager/build/outputs/apk/debug"
          else
            CMD="./gradlew :manager:assembleRelease"
            APK_DIR="manager/build/outputs/apk/release"
          fi

          [ "${{ inputs.prerelease }}" = "true" ] && CMD="$CMD -Pbeta"

          if [ "${{ inputs.debug }}" = "true" ]; then
            eval $CMD
            FILE=$(ls "$APK_DIR"/*.apk)
            VERSION=$(echo "$(basename "$FILE")" | sed -E 's/^shizuku-(.*)-(debug|release)\.apk/\1/')
            mkdir -p dist && cp "$FILE" "dist/"
          else
            eval $CMD
            NORMAL_FILE=$(ls "$APK_DIR"/*.apk)
            VERSION=$(echo "$(basename "$NORMAL_FILE")" | sed -E 's/^shizuku-(.*)-(debug|release)\.apk/\1/')
            mkdir -p dist
            cp "$NORMAL_FILE" "dist/"

            # Rebuild as compat from a clean tree: server/rish/shell also embed the
            # application id, so clean the whole native/Kotlin chain rather than just the manager.
            ./gradlew :server:clean :starter:clean :shell:clean :rish:clean :stub:clean :manager:clean
            COMPAT_CMD="./gradlew :manager:assembleRelease"
            [ "${{ inputs.prerelease }}" = "true" ] && COMPAT_CMD="$COMPAT_CMD -Pbeta"
            eval "$COMPAT_CMD -Pcompat"
            COMPAT_FILE=$(ls "$APK_DIR"/*.apk)
            cp "$COMPAT_FILE" "dist/"
          fi

          echo "versionName=$VERSION" >> $GITHUB_OUTPUT
          echo "artifactName=release-apks" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-apks
          path: dist/

      - name: Attest Build Provenance
        if: ${{ success() && !inputs.debug }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.apk

  release:
    if: ${{ !inputs.debug }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create Release Tag
        run: |
          VERSION="${{ needs.build.outputs.versionName }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION" -m "Release version $VERSION"
          git push origin "$VERSION"

      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifactName }}
          path: files

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.versionName }}
        run: |
          FLAGS="--draft"
          [ "${{ inputs.prerelease }}" = "true" ] && FLAGS="$FLAGS --prerelease"
          gh release create "$RELEASE_VERSION" files/*.apk $FLAGS

      - name: Update version.json
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.versionName }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout -B master origin/master

          python3 - "$RELEASE_VERSION" "$IS_PRERELEASE" <<'EOF'
          import glob
          import hashlib
          import json
          import pathlib
          import sys

          tag, prerelease = sys.argv[1:3]
          apks = sorted(glob.glob("files/*.apk"))

          def entry_for(path: str):
              p = pathlib.Path(path)
              version = p.name.removeprefix("shizuku-").removesuffix("-release.apk").removeprefix("v")
              return {
                  "versionName": version,
                  "apkUrl": f"https://github.com/dwicao/Shizuku/releases/download/{tag}/{p.name}",
                  "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
              }

          normal = next((entry_for(a) for a in apks if "-compat-dwicao-release.apk" not in pathlib.Path(a).name), None)
          compat = next((entry_for(a) for a in apks if "-compat-dwicao-release.apk" in pathlib.Path(a).name), None)
          if normal is None or compat is None:
              raise SystemExit(f"Expected both normal and compat APKs, got: {apks}")

          stable = dict(normal)
          stable["variants"] = {
              "moe.dwicao.shizuku": dict(normal),
              "moe.shizuku.privileged.api": dict(compat),
          }

          p = pathlib.Path("version.json")
          data = json.loads(p.read_text()) if p.exists() else {"stable": None, "beta": None}
          data["beta" if prerelease == "true" else "stable"] = stable
          p.write_text(json.dumps(data, indent=2) + "\n")
          EOF

          git add version.json
          git commit -m "ci: update version.json for ${RELEASE_VERSION}" || exit 0
          git push origin master
