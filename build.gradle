plugins {
    id "idea"
    id "com.android.library" apply false
    id "org.jetbrains.kotlin.android" apply false
}

idea.module {
    excludeDirs += file("out")
}

subprojects { subproject ->
    plugins.withId("com.android.base") {
        android {
            compileSdk = 37
            buildToolsVersion = "37.0.0"
            ndkVersion = "29.0.13113456"
            defaultConfig {
                minSdk = 24
                targetSdk = 36
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}

def gitCommitCount = Integer.parseInt("git rev-list --count HEAD".execute([], project.rootDir).text.trim())
def baseVersionName = "13.11.0"
def isBeta = project.hasProperty("beta")
// `./gradlew :manager:assembleRelease -Pcompat` builds the Samsung/Android 13 compatibility
// variant: same code and certificate, but the original package name that those devices accept.
def isCompat = project.hasProperty("compat")
def managerApplicationId = isCompat ? "moe.shizuku.privileged.api" : "moe.dwicao.shizuku"
def versionNameSuffix = isCompat ? "-compat-dwicao" : "-dwicao"
ext {
    versionCode = gitCommitCount
    versionName = "${baseVersionName}${if (isBeta) "-r${gitCommitCount}-beta" else ""}${versionNameSuffix}"
    managerApplicationId = managerApplicationId
}
